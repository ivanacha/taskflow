version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - node_modules:/workspace/frontend/node_modules
      - venv:/workspace/backend/venv
    working_dir: /workspace
    command: sleep infinity
    environment:
      - FLASK_ENV=development
      - NODE_ENV=development
      - DATABASE_URL=postgresql://taskflow_user:taskflow_password@postgres:5432/taskflow_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/workspace/backend
    depends_on:
      - postgres
      - redis
    networks:
      - taskflow_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:cached
      - node_modules_frontend:/app/node_modules
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_WS_URL=ws://localhost:5000
    depends_on:
      - backend
    networks:
      - taskflow_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app:cached
      - backend_venv:/app/venv
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_URL=postgresql://taskflow_user:taskflow_password@postgres:5432/taskflow_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev_secret_key_change_in_production
      - JWT_SECRET_KEY=dev_jwt_secret_change_in_production
      - PYTHONPATH=/app
    depends_on:
      - postgres
      - redis
    networks:
      - taskflow_network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=taskflow_db
      - POSTGRES_USER=taskflow_user
      - POSTGRES_PASSWORD=taskflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - taskflow_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskflow_network

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@taskflow.dev
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - taskflow_network

volumes:
  node_modules:
  node_modules_frontend:
  backend_venv:
  venv:
  postgres_data:
  redis_data:

networks:
  taskflow_network:
    driver: bridge