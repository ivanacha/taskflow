version: '3.8'

services:
  devcontainer:
    build: 
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - frontend-node-modules:/workspace/frontend/node_modules
      - backend-venv:/workspace/backend/venv
    command: sleep infinity
    environment:
      - FLASK_ENV=development
      - NODE_ENV=development
      - DATABASE_URL=postgresql://taskflow_user:taskflow_password@postgres:5432/taskflow_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/workspace/backend
    depends_on:
      - postgres
      - redis
    networks:
      - taskflow_network

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_password
      POSTGRES_DB: taskflow_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - taskflow_network

  redis:
    image: redis:6
    volumes:
      - redis-data:/data
    networks:
      - taskflow_network

volumes:
  frontend-node-modules:
  backend-venv:
  postgres-data:
  redis-data:

networks:
  taskflow_network:
    driver: bridge